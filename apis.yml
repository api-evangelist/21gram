aid: 21gram
name: 21gram
description: >-
  21gram (21그램) is a South Korean pet end-of-life care company that operates pet funeral homes
  and an online booking and consultation platform for pet funerals. Founded in Seoul and led
  by Kwon Shin-gu, it began as an online brokerage letting owners find licensed pet funeral
  homes nationwide and book a service with 24-hour consultation, reservation and payment, then
  moved into operating its own facilities — acquiring Korea's first pet funeral hall, Arongi
  Cheonguk, in Gwangju, Gyeonggi Province — and now runs branches including Gwangju, Namyangju
  and Cheonan plus a large charnel house. Its consumer surface covers funeral procedures and
  pricing, cremation, memorial jewelry, hearse and non-attending funeral options, urns,
  flowers, temporary storage and scattering, and grief-support classes. It is venture-backed
  and trades on secondary markets. It publishes no developer program, API documentation, or
  machine-readable API contract; its website runs on the hosted imweb site builder.
